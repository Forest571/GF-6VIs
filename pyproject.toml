[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "gf6vis"
version = "0.1.0"
description = "GF-6 vegetation-index, spectral resampling, and analysis tools"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "GF-6VIs maintainers" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
  "matplotlib>=3.7",
  "numpy>=1.24",
  "openpyxl>=3.1",
  "pandas>=2.0",
  "scikit-learn>=1.3",
  "scipy>=1.10",
  "xlsxwriter>=3.1",
]

[project.optional-dependencies]
raster = ["rasterio>=1.3"]
spectral = ["spectral>=0.23"]
dev = [
  "pytest>=8",
  "ruff>=0.6",
]

[project.scripts]
gf6vis = "gf6vis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gf6vis"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
